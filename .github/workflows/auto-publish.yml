name: SmartPickHub Draft Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */2 * *'

permissions:
  contents: write

concurrency:
  group: smartpickhub-draft-research
  cancel-in-progress: false

jobs:
  create-editorial-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate unverified draft brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-guide.mjs
      - name: Commit draft for editorial review
        run: |
          git config user.name "SmartPickHub Draft Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content-drafts/
          git diff --cached --quiet || git commit -m "content: add unverified guide research draft"
          git push
