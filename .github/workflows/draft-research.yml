name: SmartPickHub Draft Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 */2 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: smartpickhub-draft-research
  cancel-in-progress: false

jobs:
  create-editorial-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check draft research configuration
        id: config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install locked dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci
      - name: Generate unverified draft brief
        if: steps.config.outputs.configured == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-guide.mjs
      - name: Open or update editorial review pull request
        if: steps.config.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/editorial-drafts
          base: ${{ github.event.repository.default_branch }}
          delete-branch: false
          add-paths: content-drafts/
          commit-message: "content: add unverified guide research draft"
          title: "Editorial review: unverified buying-guide research draft"
          body: |
            ## Editorial review required

            This pull request contains an AI-generated research brief only.
            It is **unverified draft material**, not approved site content.

            Before any use, a human must verify product identity, exact US/UK
            variants, manufacturer claims, retailer destinations, affiliate
            policy compliance and editorial quality.

            - No automatic publication or production deployment is authorized.
            - Do not add invented ASINs, prices, ratings, reviews, stock or
              hands-on testing claims.
            - Merge only after explicit editorial approval.

      - name: Report safe skip when AI credentials are not configured
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "Draft research skipped: GEMINI_API_KEY is not configured. No draft or pull request was created." >> "$GITHUB_STEP_SUMMARY"
